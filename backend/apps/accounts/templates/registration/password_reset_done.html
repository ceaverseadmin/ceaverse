<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Link Sent - CEAVERSE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #180404 0%, #2d1810 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo {
      margin-bottom: 30px;
    }
    .logo img {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .logo h1 {
      color: #180404;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .logo p {
      color: #64748b;
      font-size: 14px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #dcfce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      color: #16a34a;
    }
    h2 {
      color: #180404;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .back-link {
      margin-top: 20px;
    }
    .back-link a {
      color: #180404;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="/cea-logo.png" alt="CEAVERSE Logo">
      <h1>CEAVERSE</h1>
      <p>Admin Portal</p>
    </div>
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
    </div>
    <h2>Reset Link Sent</h2>
    <p>We've sent a password reset link to your email address. Please check your inbox and follow the instructions to reset your password.</p>
    <p>The link will expire in 3 hours.</p>
    <div class="back-link">
      <a href="{{ frontend_url }}/admin/login/">← Back to Login</a>
    </div>
  </div>
</body>
</html>
